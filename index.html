
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Sorting Hat</title>

  <style>
    body {
      background: #17120f;
      color: #f6e5bd;
      font-family: Georgia, serif;
      text-align: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 2rem;
    }

    button {
      padding: 16px 26px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      background: #f6e5bd;
      color: #17120f;
      border: none;
    }
  </style>
</head>

<body>
  <h1>The Sorting Hat</h1>
  <p id="message">The hat is deciding your house...</p>

  <button id="playButton">🎩 Play Sorting Hat</button>

  <audio id="sound" preload="auto"></audio>

  <script>
    const houses = {
      gryffindor: "Gryffindor",
      hufflepuff: "Hufflepuff",
      ravenclaw: "Ravenclaw",
      slytherin: "Slytherin"
    };

    const params = new URLSearchParams(location.search);
    const house = (params.get("house") || "").toLowerCase();

    const audio = document.getElementById("sound");
    const button = document.getElementById("playButton");
    const message = document.getElementById("message");

    // Never reveal the selected house on the page.
    message.textContent = "";
    button.textContent = "🎩 Play Sorting Hat";

    if (houses[house]) {
      audio.src = house + ".mp3";
    } else {
      message.textContent = "Please scan a house tag to begin.";
      button.hidden = true;
    }

    async function playSound() {
      if (!houses[house]) return;

      try {
        await audio.play();
        button.textContent = "🎩 Play Sorting Hat";
      } catch (error) {
        message.textContent =
          "Tap the button to hear the Sorting Hat.";
        button.textContent = "🎩 Play Sorting Hat";
      }
    }

    button.addEventListener("click", playSound);

    // Attempt autoplay; the button remains available if blocked.
    if (houses[house]) {
      playSound();
    }
  </script>
</body>
</html>
