
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Sorting Hat</title>

  <style>
    body {
      background: #17120f;
      color: #f6e5bd;
      font-family: Georgia, serif;
      text-align: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 2rem;
    }

    #playButton {
      padding: 16px 26px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      background: #f6e5bd;
      color: #17120f;
      border: none;
    }

    #message {
      margin: 20px 0;
    }

    #socialSection {
      margin: 35px auto 0;
      max-width: 350px;
      border-top: 1px solid #675747;
      padding-top: 25px;
    }

    #socialSection[hidden] {
      display: none;
    }

    .socialTitle {
      font-size: 1.25rem;
      font-weight: bold;
    }

    .socialText {
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .socialButtons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 20px;
    }

    .socialButton {
      color: white;
      text-decoration: none;
      padding: 14px 18px;
      border-radius: 10px;
      font-family: Arial, sans-serif;
      font-size: 1rem;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .socialButton:hover {
      transform: scale(1.05);
    }

    .facebook {
      background: #1877f2;
    }

    .instagram {
      background: #b73579;
    }

    .logoContainer {
      margin: 28px auto 0;
      max-width: 220px;
    }

    .businessLogo {
      display: block;
      width: 100%;
      height: auto;
      border: 2px solid #c9a85c;
      border-radius: 14px;
      box-shadow: 0 0 20px rgba(201, 168, 92, 0.25);
    }

    .businessName {
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 15px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>

  <h1>The Sorting Hat</h1>

  <p id="message"></p>

  <button id="playButton">
    🎩 Play Sorting Hat
  </button>

  <audio id="sound" preload="auto"></audio>

  <!-- Hidden until the Sorting Hat finishes speaking -->
  <section id="socialSection" hidden>

    <p class="socialTitle">✨ Enjoyed the magic?</p>

    <p class="socialText">
      Follow 3 Dog Print for more magical creations!
    </p>

    <div class="socialButtons">

      <a
        class="socialButton facebook"
        href="https://www.facebook.com/share/1Ed5ngH8MF/?mibextid=wwXIfr"
        target="_blank"
        rel="noopener noreferrer"
      >
        Facebook
      </a>

      <a
        class="socialButton instagram"
        href="https://www.instagram.com/3dog_print/"
        target="_blank"
        rel="noopener noreferrer"
      >
        Instagram
      </a>

    </div>

    <!-- 3 Dog Print Logo -->
    <div class="logoContainer">

      <img
        class="businessLogo"
        src="3dogprint-logo.jpg"
        alt="3 Dog Print Logo"
      >

      <p class="businessName">
        🐾 3 Dog Print 🐾
      </p>

    </div>

  </section>

  <script>
    // Original secret NFC codes.
    // No need to reprogram your tags.
    const tags = {
      "7x9k2": "gryffindor",
      "m4p8q": "hufflepuff",
      "2v6n3": "ravenclaw",
      "b5r1w": "slytherin"
    };

    const params = new URLSearchParams(location.search);
    const tag = params.get("tag") || "";
    const house = tags[tag] || "";

    const audio = document.getElementById("sound");
    const button = document.getElementById("playButton");
    const message = document.getElementById("message");
    const socialSection = document.getElementById("socialSection");

    // Never reveal the selected house on screen.
    document.title = "The Sorting Hat";
    message.textContent = "";

    if (house) {
      audio.src = house + ".mp3";
    } else {
      message.textContent =
        "Please scan your Sorting Hat tag to begin.";
      button.hidden = true;
    }

    async function playSound() {
      if (!house) return;

      // Hide social buttons while the sound plays.
      socialSection.hidden = true;

      try {
        audio.currentTime = 0;
        await audio.play();
        message.textContent = "";
      } catch (error) {
        message.textContent =
          "Tap the button below to hear the Sorting Hat.";
      }
    }

    // Reveal social buttons and logo after audio ends.
    audio.addEventListener("ended", () => {
      socialSection.hidden = false;
    });

    button.addEventListener("click", playSound);

    // Try autoplay where supported.
    if (house) {
      playSound();
    }
  </script>

</body>
</html>
