<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>The Sorting Hat</title>

  <style>
    body {
      background: #17120f;
      color: #f6e5bd;
      font-family: Georgia, serif;
      text-align: center;
      padding: 40px 16px;
    }

    h1 {
      font-size: 2rem;
    }

    button {
      padding: 16px 26px;
      font-size: 1.2rem;
      border-radius: 10px;
      cursor: pointer;
      background: #f6e5bd;
      color: #17120f;
      border: none;
    }

    #message {
      margin: 20px 0;
    }
  </style>
</head>

<body>
  <h1>The Sorting Hat</h1>

  <p id="message"></p>

  <button id="playButton">🎩 Play Sorting Hat</button>

  <audio id="sound" preload="auto"></audio>

  <script>
    // Secret codes mapped to the correct audio files.
    // These codes do not reveal the house name in the URL.
    const tags = {
      "7x9k2": "gryffindor",
      "m4p8q": "hufflepuff",
      "2v6n3": "ravenclaw",
      "b5r1w": "slytherin"
    };

    const params = new URLSearchParams(location.search);
    const tag = params.get("tag") || "";
    const house = tags[tag] || "";

    const audio = document.getElementById("sound");
    const button = document.getElementById("playButton");
    const message = document.getElementById("message");

    // Never display the selected house.
    document.title = "The Sorting Hat";
    message.textContent = "";
    button.textContent = "🎩 Play Sorting Hat";

    if (house) {
      // MP3 files are in the same folder as index.html.
      audio.src = house + ".mp3";
    } else {
      message.textContent =
        "Please scan your Sorting Hat tag to begin.";
      button.hidden = true;
    }

    async function playSound() {
      if (!house) return;

      try {
        await audio.play();
      } catch (error) {
        message.textContent =
          "Tap the button below to hear the Sorting Hat.";
      }

      // Keep the button text unchanged.
      button.textContent = "🎩 Play Sorting Hat";
    }

    button.addEventListener("click", playSound);

    // Try autoplay; some browsers require a tap instead.
    if (house) {
      playSound();
    }
  </script>
</body>
</html>
